<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Text Extractor</h1>
            <p class="text-gray-600">Upload an image and extract text</p>
            <div id="serverStatus" class="mt-2 text-sm"></div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Upload Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    Upload Image
                </h2>

                <div class="space-y-4">
                    <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-indigo-500 transition-colors cursor-pointer">
                        <input type="file" id="fileInput" accept="image/*" class="hidden">
                        <div id="uploadPrompt">
                            <div class="text-6xl mb-4"></div>
                            <p class="text-gray-600">Click to upload an image</p>
                            <p class="text-sm text-gray-400 mt-2">PNG, JPG, JPEG supported</p>
                        </div>
                        <div id="previewContainer" class="hidden">
                            <img id="preview" class="max-h-64 mx-auto rounded mb-2">
                            <p id="fileName" class="text-sm text-gray-600"></p>
                        </div>
                    </div>

                    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded"></div>
                    <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded"></div>

                    <div class="flex gap-2">
                        <button id="extractBtn" disabled class="flex-1 bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
                            Extract Text
                        </button>
                        <button id="clearBtn" class="hidden px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                            ❌
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold flex items-center gap-2">
                        Extracted Text
                    </h2>
                    <button id="copyBtn" class="hidden text-sm text-indigo-600 hover:text-indigo-700">
                        📋 Copy
                    </button>
                </div>

                <div class="min-h-[400px] max-h-[500px] overflow-y-auto">
                    <div id="emptyState" class="h-full flex items-center justify-center text-gray-400">
                        <div class="text-center">
                            <div class="text-6xl mb-4 opacity-50"></div>
                            <p>Extracted text will appear here</p>
                            <p class="text-xs mt-2">Upload an image with clear, readable text</p>
                        </div>
                    </div>
                    <div id="resultText" class="hidden bg-gray-50 rounded-lg p-4 whitespace-pre-wrap text-sm text-gray-800"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let selectedFile = null;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewContainer = document.getElementById('previewContainer');
        const preview = document.getElementById('preview');
        const fileName = document.getElementById('fileName');
        const extractBtn = document.getElementById('extractBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const emptyState = document.getElementById('emptyState');
        const resultText = document.getElementById('resultText');
        const serverStatus = document.getElementById('serverStatus');

        // Check server status
        checkServerStatus();

        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_URL}/api/health`);
                if (response.ok) {
                    serverStatus.innerHTML = '<span class="text-green-600">● Server Online</span>';
                } else {
                    serverStatus.innerHTML = '<span class="text-red-600">● Server Offline</span>';
                }
            } catch (error) {
                serverStatus.innerHTML = '<span class="text-red-600">● Server Offline - Please start the backend</span>';
            }
        }

        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showError('Please select a valid image file (PNG, JPG, JPEG)');
                return;
            }

            selectedFile = file;
            hideMessages();
            resultText.classList.add('hidden');
            emptyState.classList.remove('hidden');
            copyBtn.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                fileName.textContent = file.name;
                uploadPrompt.classList.add('hidden');
                previewContainer.classList.remove('hidden');
                extractBtn.disabled = false;
                clearBtn.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        // Extract text via backend
        extractBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            extractBtn.disabled = true;
            extractBtn.textContent = 'Extracting...';
            hideMessages();

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const response = await fetch(`${API_URL}/api/extract-text`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success && data.text.trim()) {
                    resultText.textContent = data.text;
                    emptyState.classList.add('hidden');
                    resultText.classList.remove('hidden');
                    copyBtn.classList.remove('hidden');
                    showSuccess('Text extracted successfully!');
                } else {
                    showError(data.error || 'No text found in the image. Please try another image with clear text.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to server. Make sure the backend is running on http://localhost:3000');
            } finally {
                extractBtn.disabled = false;
                extractBtn.textContent = 'Extract Text';
            }
        });

        // Clear button
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            uploadPrompt.classList.remove('hidden');
            previewContainer.classList.add('hidden');
            extractBtn.disabled = true;
            clearBtn.classList.add('hidden');
            resultText.classList.add('hidden');
            emptyState.classList.remove('hidden');
            copyBtn.classList.add('hidden');
            hideMessages();
        });

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(resultText.textContent);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 2000);
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function hideMessages() {
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
